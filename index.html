<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="2026년의 화제를 20.26초 안에 풀어내는 물리 액션 웹게임"
    />
    <title>20.26</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/main-menu.css" />
    <link rel="stylesheet" href="css/stage-select.css" />
    <link rel="stylesheet" href="css/modal.css" />
    <link rel="stylesheet" href="css/pause.css" />
    <link rel="stylesheet" href="css/settings.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <!--
      메인 화면 — assets/images/concept/main.png의 UI 배치를 따른다.
      위에서부터 로고 → 버튼 3개 순서다.
      컨셉 이미지의 배경 일러스트와 주변 장식은 의도적으로 넣지 않는다.
      (음성 조작을 걷어내면서 로고 아래의 마이크·파형 마크도 함께 뺐다.)
    -->
    <div class="main-menu" id="main-menu">
      <section class="main-menu-card ui-scaled" aria-labelledby="main-menu-title">
        <h1 class="menu-logo" id="main-menu-title">
          <img
            src="assets/images/ui/Main/title-logo-20-26.webp"
            alt="20.26"
            width="960"
            height="560"
          />
        </h1>

        <div class="main-menu-actions">
          <button class="menu-button menu-button--play" id="main-play-button" type="button">
            <span>게임 시작</span>
          </button>

          <button
            class="menu-button menu-button--challenge"
            id="main-challenge-button"
            type="button"
            disabled
            aria-describedby="main-challenge-note"
          >
            <img
              class="menu-button-icon"
              src="assets/images/ui/Main/icon-trophy.webp"
              alt=""
              width="160"
              height="147"
            />
            <span>챌린지 모드</span>
            <em class="menu-button-badge" id="main-challenge-note">준비 중</em>
          </button>

          <button
            class="menu-button menu-button--settings"
            id="main-settings-button"
            type="button"
            aria-expanded="false"
            aria-controls="settings-modal"
          >
            <img
              class="menu-button-icon"
              src="assets/images/ui/Main/icon-settings.webp"
              alt=""
              width="160"
              height="161"
            />
            <span>설정</span>
          </button>
        </div>
      </section>
    </div>

    <!-- 스테이지 데이터는 7개 스테이지 엔진이 준비되면 동적으로 채운다. -->
    <div class="stage-select-screen hidden" id="stage-select-screen">
      <section class="main-menu-card ui-scaled" aria-labelledby="stage-select-title">
        <div class="main-menu-heading">
          <div>
            <p class="menu-kicker">SELECT YOUR 20.26</p>
            <h2 id="stage-select-title">스테이지 선택</h2>
          </div>
        </div>

        <div class="stage-select-grid" id="stage-select-grid">
          <div class="stage-select-card stage-select-card--soon">
            <span class="stage-number">LOADING</span>
            <strong>스테이지 불러오는 중</strong>
            <span class="stage-description">게임 엔진을 준비하고 있습니다.</span>
          </div>
        </div>

        <div class="main-menu-actions">
          <button class="secondary-button" id="stage-select-back-button" type="button">메인 화면으로</button>
        </div>
      </section>
    </div>

    <main class="app-shell" inert>
      <section class="game-card" aria-label="게임 화면">
        <div id="game-container">
          <div id="corruption" class="game-effect-overlay" aria-hidden="true"></div>
          <div id="light-overlay" class="game-effect-overlay" aria-hidden="true"></div>
        </div>
      </section>

      <!--
        HUD 레이어 — 1920×1080 설계 좌표계 위에 얹힌다(css/base.css의 "UI 배율 규칙").
        Phaser 캔버스와 같은 배율(--ui-scale)로 통째로 줄어들고 늘어나므로
        창 비율이 달라져도 HUD 비율과 캔버스 위 위치가 그대로 유지된다.

        음성 패널과 명령어 카드를 걷어내 지금은 일시정지 버튼만 남아 있다.
        새 게임의 HUD 위젯은 이 레이어 안에 넣는다.
      -->
      <div class="hud-layer">
        <section class="stage-hud" id="stage-hud" aria-live="polite" hidden>
          <div class="stage-hud-heading">
            <strong id="stage-hud-title">STAGE</strong>
            <output id="stage-hud-timer">20.26</output>
          </div>
          <div class="stage-hud-detail">
            <span id="stage-hud-action">입력 00</span>
            <span id="stage-hud-anomaly">대기</span>
          </div>
          <div class="stage-hud-risk" aria-hidden="true"><i id="stage-hud-risk" data-level="safe"></i></div>
        </section>
        <button class="pause-button" id="pause-button" type="button" aria-label="게임 일시정지" hidden>
          <span aria-hidden="true">Ⅱ</span>
          일시정지
        </button>
      </div>
    </main>

    <!-- 결과(클리어 · 타임오버) — 스테이지가 생기면 다시 열린다. -->
    <div class="modal-backdrop hidden" id="result-modal">
      <section class="modal ui-scaled" aria-labelledby="modal-title">
        <p class="modal-step" id="modal-step">RESULT</p>
        <h2 id="modal-title">결과</h2>
        <p id="modal-copy"></p>
        <p class="modal-result" id="modal-result"></p>
        <button class="primary-button" id="primary-button" type="button">다시 도전</button>
        <button class="secondary-button" id="secondary-button" type="button">메인 화면으로</button>
      </section>
    </div>

    <div class="pause-backdrop hidden" id="pause-modal">
      <section class="pause-dialog ui-scaled" role="dialog" aria-modal="true" aria-labelledby="pause-title">
        <p class="modal-step">PAUSED</p>
        <h2 id="pause-title">잠시 멈췄어요</h2>
        <p>타이머와 게임 진행이 멈춰 있습니다.</p>
        <button class="primary-button" id="resume-button" type="button">계속하기</button>
        <button class="secondary-button" id="pause-main-button" type="button">메인 화면으로</button>
      </section>
    </div>

    <!--
      설정 — assets/images/concept/setting.png의 배치를 따른다.
      프레임·행 슬롯·아이콘·노브·토글·버튼은 assets/images/ui/settings/*.png 에셋이다.

      컨셉 이미지와 다른 점은 두 가지다.
        · "음성 입력 감도" 행은 음성 조작을 걷어내면서 함께 제거했다(4행 구성).
        · "도움말" 행은 넣지 않는다.
    -->
    <div class="settings-backdrop hidden" id="settings-modal">
      <section
        class="settings-dialog ui-scaled"
        id="settings-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="settings-title"
        tabindex="-1"
      >
        <h2 class="settings-title" id="settings-title">
          <img src="assets/images/ui/settings/icon-gear.png" alt="" width="209" height="215" />
          <span>설정</span>
        </h2>

        <div class="settings-frame">
          <ul class="settings-rows">
            <li class="settings-row">
              <!-- 스피커 아이콘이 곧 음소거 버튼이다(컨셉 이미지에는 별도 음소거 행이 없다). -->
              <button
                class="settings-row-icon settings-mute"
                id="settings-mute-button"
                type="button"
                aria-pressed="false"
                aria-label="모든 소리 끄기"
              >
                <img src="assets/images/ui/settings/icon-volume.png" alt="" width="188" height="189" />
              </button>
              <label class="settings-row-label" for="master-volume">마스터 볼륨</label>
              <input class="settings-slider" id="master-volume" type="range" min="0" max="100" step="1" value="80" />
              <output class="settings-row-value" id="master-volume-value" for="master-volume">80</output>
            </li>

            <li class="settings-row">
              <img class="settings-row-icon" src="assets/images/ui/settings/icon-bgm.png" alt="" width="188" height="188" />
              <label class="settings-row-label" for="bgm-volume">BGM</label>
              <input class="settings-slider" id="bgm-volume" type="range" min="0" max="100" step="1" value="45" />
              <output class="settings-row-value" id="bgm-volume-value" for="bgm-volume">45</output>
            </li>

            <li class="settings-row">
              <img class="settings-row-icon" src="assets/images/ui/settings/icon-sfx.png" alt="" width="187" height="188" />
              <label class="settings-row-label" for="sfx-volume">효과음</label>
              <input class="settings-slider" id="sfx-volume" type="range" min="0" max="100" step="1" value="90" />
              <output class="settings-row-value" id="sfx-volume-value" for="sfx-volume">90</output>
            </li>

            <li class="settings-row">
              <img class="settings-row-icon" src="assets/images/ui/settings/icon-display.png" alt="" width="182" height="183" />
              <span class="settings-row-label" id="settings-fullscreen-label">전체 화면</span>
              <button
                class="settings-switch"
                id="settings-fullscreen-toggle"
                type="button"
                role="switch"
                aria-checked="false"
                aria-labelledby="settings-fullscreen-label"
              >
                <span id="settings-fullscreen-state">OFF</span>
              </button>
            </li>
          </ul>

          <div class="settings-actions">
            <button class="settings-action settings-action--apply" id="settings-apply-button" type="button">
              <img src="assets/images/ui/settings/icon-check.png" alt="" width="175" height="153" />
              <span>적용</span>
            </button>
            <button class="settings-action settings-action--back" id="settings-back-button" type="button">
              <img src="assets/images/ui/settings/icon-undo.png" alt="" width="176" height="164" />
              <span>뒤로가기</span>
            </button>
          </div>
        </div>
      </section>
    </div>

    <!--
      로드 순서 규칙: 아래로 갈수록 위의 전역에 의존한다.
      새 파일을 추가할 때는 자기 트랙 블록 안에 넣는다.
    -->
    <script src="vendor/phaser.min.js"></script>

    <!-- 공통 계약 (동결) -->
    <script src="js/core/game-events.js"></script>
    <script src="js/config/stage-geometry.js"></script>
    <script src="js/config/balance.js"></script>
    <script src="js/content/strings.ko.js"></script>

    <!-- C1 · 이미지 에셋 / C2 · 사운드 에셋 -->
    <script src="js/assets/image-manifest.js"></script>
    <script src="js/assets/audio-manifest.js"></script>
    <script src="js/assets/asset-loader.js"></script>

    <!-- B · DOM 참조 (아트 뷰가 참조하므로 먼저 로드) -->
    <script src="js/ui/dom.js"></script>

    <!-- A · 비주얼 -->
    <script src="js/art/theme.js"></script>
    <script src="js/art/sprite-animations.js"></script>
    <script src="js/art/viewport-fit.js"></script>

    <!-- C2 · 사운드 -->
    <script src="js/audio/audio-bus.js"></script>
    <script src="js/audio/sfx-player.js"></script>
    <script src="js/audio/bgm-player.js"></script>

    <!-- B · 기능 -->
    <script src="js/ui/modal-flow.js"></script>
    <script src="js/ui/settings-flow.js"></script>
    <script src="js/ui/main-menu-flow.js"></script>
    <script src="js/ui/pause-flow.js"></script>
    <script src="js/game.js"></script>
    <!--
      ES modules are kept as the source/test files, while this generated classic
      bundle also works when index.html is opened directly through file://.
    -->
    <script src="js/archive/game-classic.js"></script>
  </body>
</html>
